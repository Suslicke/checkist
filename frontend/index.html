<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The paper of each theme (--ck-paper, Чекист 2.0): the system bar of Android and of an installed app. Without the
         script the browser picks the pair by the system theme; the script below gives both the theme the person chose. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f2f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121012" />
    <script>
      // Before the first paint (see src/theme/theme.ts and src/theme/platform.ts). Every read of the storage is guarded:
      // a blocked storage leaves the defaults — the theme of the system, the platform of the device, no privacy.
      ;(function () {
        var root = document.documentElement
        var read = function (key) {
          try {
            return localStorage.getItem(key)
          } catch (error) {
            return null
          }
        }
        // Theme: a saved choice wins; without one the theme of the system. The dark theme is the default of the
        // stylesheet; only the light one needs the attribute.
        var saved = null
        try {
          saved = localStorage.getItem('checkist.theme')
        } catch (error) {}
        var light = false
        try {
          light = saved === 'light' || (saved !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches)
        } catch (error) {}
        if (light) root.setAttribute('data-theme', 'light')
        try {
          var metas = document.querySelectorAll('meta[name="theme-color"]')
          for (var index = 0; index < metas.length; index += 1) metas[index].setAttribute('content', light ? '#f4f2f2' : '#121012')
        } catch (error) {}
        // Platform (docs/design-system/platforms.md): the grammar of the bars, the sheets and the back button. A computer
        // takes the Android one. `checkist.platform` = 'ios' | 'android' wins, for a check on another device.
        var platform = 'android'
        try {
          var forced = read('checkist.platform')
          var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
          platform = forced === 'ios' || forced === 'android' ? forced : ios ? 'ios' : 'android'
          if (platform === 'ios' && 'switch' in HTMLInputElement.prototype) root.setAttribute('data-switch', 'native')
        } catch (error) {}
        root.setAttribute('data-platform', platform)
        // Privacy: the sums are blurred from the first paint (src/theme/privacy.ts).
        if (read('checkist.privacy') === '1') root.setAttribute('data-privacy', '')
      })()
    </script>
    <meta name="description" content="Чекист — семейный бюджет по фото чеков и тратам словами: распознавание, лимиты по категориям, цены в магазинах и статистика трат." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installable app: «На экран Домой» on iPhone, «Установить приложение» on Android. The service worker
         (public/sw.js, registered in src/offline/service-worker.ts) opens the app without network; navigations go to
         the network first, so a deploy is shown on the next online open. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Чекист" />
    <!-- "default": iOS draws the clock and the battery dark on its own light bar and starts the page below it. "black-translucent"
         would paint them white over the page in both themes — unreadable on the light paper of 2.0 (2026-11-20). The top bar of
         the shell (src/shell.css) still adds env(safe-area-inset-top), which is 0 here and the cut-out height elsewhere. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Geologica (display), Onest (interface) and JetBrains Mono (the paper receipt), OFL 1.1, from Google Fonts: no
         Content-Security-Policy forbids it (deploy/Caddyfile, deploy/docker/Caddyfile); display=swap shows system-ui until
         the fonts arrive. One request, variable weights. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400..800&amp;family=Onest:wght@400..800&amp;family=JetBrains+Mono:wght@400..600&amp;display=swap" />
    <title>Чекист</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
